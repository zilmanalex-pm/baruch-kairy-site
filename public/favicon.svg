<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Clip to hide top-left circle's bottom-right arc where it goes "under" bottom-right circle -->
    <clipPath id="tl">
      <rect x="0" y="0" width="32" height="16"/>
      <rect x="0" y="16" width="16" height="16"/>
    </clipPath>
    <!-- Clip to hide bottom-right circle's top-left arc where it goes "under" top-left circle -->
    <clipPath id="br">
      <rect x="16" y="0" width="16" height="16"/>
      <rect x="0" y="16" width="32" height="16"/>
    </clipPath>
  </defs>
  <!-- Background circles (drawn first, appear "behind") -->
  <circle cx="20" cy="12" r="6.5" fill="none" stroke="#40798C" stroke-width="2.8"/>
  <circle cx="12" cy="20" r="6.5" fill="none" stroke="#40798C" stroke-width="2.8"/>
  <!-- Foreground circles with interlocking -->
  <circle cx="12" cy="12" r="6.5" fill="none" stroke="#40798C" stroke-width="2.8"/>
  <circle cx="20" cy="20" r="6.5" fill="none" stroke="#40798C" stroke-width="2.8"/>
</svg>
